<!DOCTYPE html>
<!-- AI Panel Studio · 「一束追光贯穿全片」 · onetake composition. Every value is a pure function of t (seconds).
     Contract: window.__seek(t) → Promise, window.__ready, window.__meta, __track (screen boxes), __motion, __events.
     Query: ?play (real time loop) · ?t=6.4&hud (pin a frame). Beat sheet: README.md next to this file. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 圆桌演播厅 · demo</title>
<style>
:root{ --ground:#0b0d10; --deep:#07080a; --card:#16191e; --line:#23272d; --mute:#9ba3ae; --ink:#eceef1; --accent:#f5b841;
  --text:'Microsoft YaHei',sans-serif; --display:'Microsoft YaHei',sans-serif; --mono:Consolas,monospace;
  --hairline:rgba(236,238,241,.08); --hairline2:rgba(236,238,241,.14); }
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:var(--text);color:var(--ink);-webkit-font-smoothing:antialiased;font-kerning:normal}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
canvas.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap}
.av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink);background:var(--ground)}
/* input → header */
#box{position:absolute;box-sizing:border-box;background:var(--card)}
#box .hint{position:absolute;left:40px;top:96px;font-size:17px;color:var(--mute);white-space:nowrap}
#box .hint b{color:var(--ink);font-weight:600;margin:0 10px;font-family:var(--mono)}
#box .cnt{position:absolute;right:220px;top:98px;font:15px var(--mono);color:var(--mute)}
#box .btn{position:absolute;right:28px;top:84px;height:46px;padding:0 24px;border-radius:8px;background:#262a31;color:var(--ink);font-size:17px;font-weight:600;line-height:46px;white-space:nowrap}
#topic{font-size:56px;font-weight:700;line-height:1.2;color:var(--ink)}
/* header right */
#tabs{font-size:18px;color:var(--mute)} #tabs span{display:inline-block;margin-left:26px;padding-bottom:6px;border-bottom:2px solid transparent}
#tabs span.on{color:var(--ink);border-bottom-color:var(--ink)}
#turns{font:17px var(--mono);color:var(--mute)} #turns i{display:inline-block;width:110px;height:3px;border-radius:2px;background:var(--hairline2);vertical-align:4px;margin-left:12px;position:relative;overflow:hidden}
#turns i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
/* seat bar */
.panel{position:absolute;background:var(--card);border-radius:16px}
.seat{position:absolute;top:120px;width:364.8px;height:130px;border-radius:16px}
.seat .av{width:56px;height:56px;font-size:22px}
.seat .nm{position:absolute;font-size:22px;font-weight:600;white-space:nowrap}
.seat .tt{position:absolute;font-size:15px;color:var(--mute);white-space:nowrap}
.seat .st{position:absolute;right:22px;top:36px;font-size:15px;color:var(--mute);white-space:nowrap}
.seat .st .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.6;margin-right:7px;vertical-align:2px}
.seat .st.on{color:var(--accent);font-weight:600}
.seat .st.on .d{background:var(--accent);opacity:1}
.seat .fo{position:absolute;left:20px;top:94px;font-size:14px;color:var(--mute);white-space:nowrap}
.seat .fo b{color:var(--ink);font-weight:500;margin-left:8px}
#hostlines{position:absolute;top:132px;height:106px;border-left:1px solid var(--hairline);border-right:1px solid var(--hairline)}
/* stage */
#glow{position:absolute;left:50px;top:262px;width:1300px;height:420px;background:radial-gradient(55% 100% at 50% 0%,rgba(245,184,65,.13),rgba(245,184,65,0) 72%)}
.sav{width:88px;height:88px;font-size:34px}
.stx .n{font-size:36px;font-weight:700;line-height:1.2}
.stx .s{font-size:18px;color:var(--mute);margin-top:4px}
.stx .s b{color:var(--ink);font-weight:500}
.cap{width:1180px;font-size:46px;font-weight:500;line-height:1.45;text-align:center;white-space:normal;text-wrap:balance;transform-origin:590px 0;padding:0 60px;box-sizing:border-box}
.cap .g{color:transparent}
.cap i{display:inline-block;width:4px;height:.86em;margin:0 2px 0 4px;vertical-align:-.1em;background:var(--accent);box-shadow:0 0 14px rgba(245,184,65,.6)}
#divider{position:absolute;left:48px;top:668px;width:1304px;height:1px;background:var(--hairline)}
.row{width:900px}
.row .av{width:34px;height:34px;font-size:15px;left:0;top:0}
.row .h{position:absolute;left:52px;top:4px;font-size:17px;white-space:nowrap}
.row .h b{font-weight:600;margin-right:10px} .row .h span{color:var(--mute);font-size:15px}
.row .h em{position:absolute;left:820px;font:normal 14px var(--mono);color:var(--mute)}
.row .x{position:absolute;left:52px;top:38px;width:860px;font-size:21px;line-height:1.6;white-space:normal}
/* right column */
.rh{font-size:24px;font-weight:700} .rh small{font:16px var(--mono);color:var(--mute);margin-left:10px;font-weight:400}
.rm{font-size:17px;color:var(--mute)}
.dv{font-size:18px;color:var(--ink)}
.lab{font-size:14px;color:var(--mute)}
.tick{position:absolute;width:2px;height:12px;border-radius:2px;background:var(--hairline2)}
.spav{width:32px;height:32px;font-size:14px}
/* summary */
#sumlab{font-size:18px;color:var(--mute)}
#stats{font-size:17px;color:var(--mute)} #stats .it{display:inline-block;margin-right:44px}
#stats .it b{font:500 30px var(--mono);color:var(--ink);margin:0 4px 0 10px}
#sumdiv{position:absolute;left:240px;top:1604px;width:1440px;height:1px;background:var(--hairline)}
#para{width:1060px;height:152px;overflow:hidden;font-size:28px;line-height:1.8;white-space:normal;color:var(--ink);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.25) 100%)}
#para .dc{float:left;font-size:92px;line-height:1;font-weight:700;margin:6px 18px 0 0}
#para .r{color:var(--mute)}
/* end card */
#wm{font-size:96px;font-weight:700;line-height:1.2;letter-spacing:.02em}
#wm span{display:inline-block;transform-origin:50% 88%}
#wmsub{font:24px var(--mono);letter-spacing:.24em;color:var(--mute)}
/* the light */
.lt{position:absolute;left:0;top:0}
#pool{position:absolute;left:0;top:0;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,184,65,.16),rgba(245,184,65,0))}
#trails{position:absolute;left:0;top:0;overflow:visible}
#hud{position:absolute;right:14px;bottom:10px;font:14px Consolas,monospace;color:#f55;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="full" width="1920" height="1080"></canvas>
  <div id="world">
    <div id="studio">
      <div id="tabs" class="a" data-k="tabs"></div>
      <div id="turns" class="a" data-k="turns"></div>
      <div id="seatbar" class="panel" data-k="seatbar" style="left:48px;top:120px;width:1824px;height:130px"></div>
      <div id="hostlines"></div>
      <div id="seats"></div>
      <div id="glow" data-k="glow"></div>
      <div id="stagebits"></div>
      <div id="divider"></div>
      <div id="rows"></div>
      <div id="rcol" class="panel" data-k="rcol" style="left:1400px;top:276px;width:472px;height:770px"></div>
      <div id="rbits"></div>
    </div>
    <svg id="trails" width="1920" height="1080" data-k="trails"><path id="trA" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path id="trB" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="box" data-k="box"><div class="hint">专家 <b>−</b><b style="margin:0">4</b><b>+</b> 位　　话题 5~200 字</div><div class="cnt" id="cnt">0/200</div><div class="btn" id="btn">生成嘉宾阵容</div></div>
    <div id="topic" class="a" data-k="topic"></div>
    <div id="summary">
      <div id="sumlab" class="a" data-k="sumlab">本场总结</div>
      <div id="stats" class="a"></div>
      <div id="sumdiv" data-k="sumdiv"></div>
      <div id="para" class="a" data-k="para"></div>
    </div>
    <div id="wm" class="a" data-k="wm"></div>
    <div id="wmsub" class="a" data-k="wmsub">AI PANEL STUDIO</div>
    <div id="pool" data-k="pool"></div>
    <div id="ld"></div>
    <div id="light" class="lt" data-k="light"></div>
  </div>
  <canvas id="grain" class="full" width="1920" height="1080"></canvas>
  <div id="hud"></div>
</div>
<script src="motion.js"></script>
<script src="look.js"></script>
<script>
// ════════════════════════════════════════ data — a real DeepSeek run ════════════════════════════════════════
// backend/data/live/after-id-rule/raw.json → detail.participants / utterances / insights / summary (copied, not invented)
const TOPIC = '生成式 AI 会让初级程序员岗位消失吗';
const P = {
  '周': {name:'周衡',   title:'科技访谈节目主持人',       prof:'科技播客主理人',   color:'#C3C9D2', focus:'把争论拉回具体的人'},
  '林': {name:'林晓岚', title:'某大学经济学院副教授',     prof:'劳动经济学者',     color:'#FF8A6B', focus:'招聘数据'},
  '陈': {name:'陈远帆', title:'某理工大学计算机学院教授', prof:'软件工程教授',     color:'#5CC8F0', focus:'基本功与真实项目'},
  '赵': {name:'赵启明', title:'某智库科技政策研究中心主任', prof:'科技政策研究员', color:'#6FD6A6', focus:'政策如何互补'},
  '孙': {name:'孙维莉', title:'某头部互联网公司研发总监', prof:'互联网公司技术总监', color:'#B7A3FF', focus:'团队真实案例'},
};
const SEATS = ['林','陈','周','赵','孙'];                 // SeatBar: host centred, experts by seat number on both sides
// utterances 2, 3, 4, 6, 9 — long ones shown from a clause boundary (marked ……)
const U = [
  {p:'孙', text:'我们团队去年就把基础CRUD和数据清洗类的活交给AI了', time:'12:53:42', tab:0, cps:18},
  {p:'陈', text:'……恰恰说明工具放大了初级程序员的能力，而不是让这个层级消失', time:'12:53:47', tab:1, cps:20},
  {p:'林', text:'企业不是让五个初级都变强，而是干脆少招三个。', time:'12:53:53', tab:1, cps:28},
  {p:'赵', text:'这个缺口得靠政策补。', time:'12:54:04', tab:1, cps:26},
  {p:'周', text:'减掉的坑和补上的能力，中间隔的到底是什么？', time:'12:54:18', tab:2, cps:15},
];
const DIV = [ // insights: two divergences, status emerging (初现)
  {text:'生成式 AI 正在实质性替代部分初级程序员的工作', sup:['林','孙','赵'], opp:['陈']},
  {text:'初级岗位减少是结构性挪动而非入口收窄',         sup:['陈'],          opp:['林','孙','赵']},
];
const SUM_FIRST = '天讨论围绕生成式 AI 是否会让初级程序员岗位消失展开。';
const SUM_REST  = '四位嘉宾都承认一线部分初级工作已被 AI 承接，孙维莉提到团队将 CRUD 和数据清洗交给 AI，项目组初级从八人减到三人；林晓岚指出初级研发岗起薪和编制在收缩……';
const STATS = [['时长','1','分','37','秒'],['发言','17','条'],['专家发言','12','轮'],['共识','0','条'],['分歧','2','条']];
const WORDMARK = 'AI 圆桌演播厅';

// ════════════════════════════════════════ timeline (seconds) ════════════════════════════════════════
const DUR = 25, FPS = 30;
const BOX_IN = 0.95, TYPE0 = 1.15, TYPE_CPS = 10, ENTER = 3.05;
const LAND_HOST = 3.6, SPLIT0 = 3.64, SPLIT_DT = 0.07, SPLIT_FLY = 0.32, SPLIT_OUT = 4.4;
const PANELS_IN = 4.62;
// the light's jumps: [t0, t1, from, to]
const HOP = [[5.15,5.50,'周','孙'],[7.35,7.70,'孙','陈'],[9.40,9.65,'陈','林'],[10.60,10.85,'林','赵'],[11.40,11.65,'赵','周']];
const SPEC0 = 14.2, LIGHT_SPEC = [14.3, 15.15], MORPH0 = 14.4, SPAV0 = 15.15;
const SUM0 = 17.0, LIGHT_SUM = [17.05, 18.3], SUM_IN = 17.75, PARA_IN = 18.35;
const END0 = 20.8, LIGHT_END = [20.92, 21.6], WM_IN = 21.62, SUB_IN = 22.15;
window.__meta = {dur: DUR, fps: FPS, w: 1920, h: 1080,
  inFrame: {light: [0.2, 18.3], dc: [18.3, 20.8, 'whole'], wm: [22.0, 25, 'whole']}};

const {clamp, lerp, seg, sstep, ssstep, spring, ring} = OM, E = OM.ease;
const $ = id => document.getElementById(id);
const AMB = '245,184,65';

// ════════════════════════════════════════ build ════════════════════════════════════════
const SEAT_W = 364.8, seatX0 = i => 48 + i * SEAT_W;
const seatEls = {}, SEAT_AV = {};          // avatar centres in world, filled in measure()
SEATS.forEach((k, i) => {
  const p = P[k], d = document.createElement('div'); d.className = 'seat'; d.dataset.k = 'seat-' + k; d.style.left = seatX0(i) + 'px';
  d.innerHTML = `<div class="av" style="box-shadow:inset 0 0 0 2.5px ${p.color}">${k}</div><div class="nm" style="color:${p.color}">${p.name}</div>`
    + `<div class="tt">${k === '周' ? '主持人' : p.title}</div>` + (k === '周' ? '' : `<div class="st"><span class="d"></span><span class="w">待机</span></div><div class="fo">关注<b>${p.focus}</b></div>`);
  $('seats').appendChild(d); seatEls[k] = d;
});
const stageEls = U.map((u, i) => {
  const p = P[u.p];
  const av = document.createElement('div'); av.className = 'av sav'; av.dataset.k = 'sav-' + i; av.textContent = u.p;
  av.style.boxShadow = `inset 0 0 0 3px ${p.color}`;
  const tx = document.createElement('div'); tx.className = 'a stx'; tx.dataset.k = 'stx-' + i;
  tx.innerHTML = `<div class="n" style="color:${p.color}">${p.name}</div><div class="s">${p.prof} · ${p.title}</div>`;
  const cap = document.createElement('div'); cap.className = 'a cap'; cap.dataset.k = 'cap-' + i;
  $('stagebits').append(av, tx, cap);
  return {av, tx, cap};
});
const rowEls = U.slice(0, 4).map((u, i) => {
  const p = P[u.p], d = document.createElement('div'); d.className = 'a row'; d.dataset.k = 'row-' + i;
  d.innerHTML = `<div class="av" style="box-shadow:inset 0 0 0 2px ${p.color}">${u.p}</div><div class="h"><b style="color:${p.color}">${p.name}</b><span>${p.prof} · ${p.title}</span><em>${u.time}</em></div><div class="x">${u.text}</div>`;
  $('rows').appendChild(d); return d;
});
const TABS = ['开场','追问','串联','收尾'];
$('tabs').innerHTML = TABS.map(s => `<span>${s}</span>`).join('');
// right column
const R = {};
function rb(k, cls, html, x, y) { const d = document.createElement('div'); d.className = 'a ' + cls; d.dataset.k = k; d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px'; $('rbits').appendChild(d); R[k] = d; return d; }
rb('ch', 'rh', '共识<small>0</small>', 1432, 304);
rb('cm', 'rm', '嘉宾们还没有形成共识', 1432, 352);
rb('dh', 'rh', '分歧<small id="dcount">0</small>', 1432, 412);
rb('dm', 'rm', '暂未出现明显分歧', 1432, 460);
const LY = [552, 690], LX0 = 1540, LX1 = 1730, LXC = 1635;
const SP = [];                       // spectrum avatars
DIV.forEach((dv, i) => {
  rb('dv' + i, 'dv', dv.text, 1432, LY[i] - 50);
  rb('l0' + i, 'lab', '赞成', 1432, LY[i] + 22); rb('l1' + i, 'lab', '初现', LXC - 14, LY[i] + 22); rb('l2' + i, 'lab', '反对', 1802, LY[i] + 22);
  const tk = document.createElement('div'); tk.className = 'tick'; tk.dataset.k = 'tick' + i; tk.style.left = (LXC - 1) + 'px'; tk.style.top = (LY[i] - 6) + 'px'; $('rbits').appendChild(tk); R['tick' + i] = tk;
  dv.sup.forEach((k, j) => SP.push({k, line: i, x: LX0 - 28 - j * 28, order: SP.length}));
  dv.opp.forEach((k, j) => SP.push({k, line: i, x: LX1 + 28 + j * 28, order: SP.length}));
});
SP.forEach((s, j) => { const d = document.createElement('div'); d.className = 'av spav'; d.dataset.k = 'spav-' + j; d.textContent = s.k;
  d.style.boxShadow = `inset 0 0 0 2px ${P[s.k].color}, 0 0 0 2px var(--card)`; d.style.background = 'var(--card)'; $('rbits').appendChild(d); s.el = d; });
// summary
$('stats').innerHTML = STATS.map(s => `<span class="it">${s[0]}<b>${s[1]}</b>${s[2]}${s[3] ? `<b>${s[3]}</b>${s[4]}` : ''}</span>`).join('');
const statEls = [...$('stats').children];
$('para').innerHTML = `<span class="dc" id="dc" data-k="dc">今</span><span id="pf">${SUM_FIRST}</span><span class="r" id="pr">${SUM_REST}</span>`;
// wordmark
const wmL = [...WORDMARK].map(ch => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; $('wm').appendChild(s); return s; });
// the light and its four splits
const LD = ['陈','赵','林','孙'].map((k, j) => { const d = document.createElement('div'); d.className = 'lt'; d.dataset.k = 'ld-' + k; $('ld').appendChild(d); return {k, el: d, j}; });

// ════════════════════════════════════════ measure (after fonts) ════════════════════════════════════════
let PRE = [], STX = [], DC = null, WM = {}, KEYS = [], TRAIL = [], TRS = [];
const STAGE_CX = 700, AV_Y = 340, CAP_Y = 410;
function measure() {
  $('world').style.transform = 'none';
  const tp = $('topic');
  for (let n = 0; n <= TOPIC.length; n++) { tp.textContent = TOPIC.slice(0, n); PRE.push(tp.getBoundingClientRect().width); }
  // seat insides: experts left-aligned, host centred
  SEATS.forEach((k, i) => {
    const d = seatEls[k], av = d.querySelector('.av'), nm = d.querySelector('.nm'), tt = d.querySelector('.tt');
    let ax = 20;
    if (k === '周') { const w = Math.max(nm.getBoundingClientRect().width, tt.getBoundingClientRect().width); ax = (SEAT_W - (56 + 14 + w)) / 2; }
    const ay = k === '周' ? 37 : 22;
    av.style.left = ax + 'px'; av.style.top = ay + 'px';
    nm.style.left = (ax + 70) + 'px'; nm.style.top = (ay - 2) + 'px'; tt.style.left = (ax + 70) + 'px'; tt.style.top = (ay + 32) + 'px';
    SEAT_AV[k] = {x: seatX0(i) + ax + 28, y: 120 + ay + 28};
  });
  $('hostlines').style.left = seatX0(2) + 'px'; $('hostlines').style.width = SEAT_W + 'px';
  STX = stageEls.map(s => { const w = s.tx.getBoundingClientRect().width, left = STAGE_CX - (108 + w) / 2; return {avx: left + 44, txl: left + 108}; });
  const r = $('dc').getBoundingClientRect(), pr = $('para').getBoundingClientRect();
  DC = {x: PARA.x + (r.left - pr.left) - 6, y: PARA.y + (r.top - pr.top) + 2, w: r.width + 10, h: 92};
  const wr = $('wm').getBoundingClientRect(); const gw = 54 + wr.width;
  WM = {w: wr.width, left: 760 - gw / 2 + 54, top: 1600 - wr.height / 2, h: wr.height};
  WM.dot = {x: WM.left - 34, y: WM.top + WM.h * 0.52}; WM.cx = 760;
  const subw = $('wmsub').getBoundingClientRect().width; WM.sub = {x: 760 - subw / 2 + 27, y: WM.top + WM.h + 14};
  buildCamera(); buildTrails();
}
const PARA = {x: 240, y: 1640};

// ════════════════════════════════════════ the light ════════════════════════════════════════
const HALO = 72;
function caretX(t) { const n = OM.typeOn(t, TYPE0, TOPIC, {cps: TYPE_CPS}).n; return 400 + PRE[n] * (40 / 56) + 5; }
const CARET_Y = 504;
function hopH(a, b) { return 46 + 0.075 * Math.hypot(b.x - a.x, b.y - a.y); }
function hopPos(t, h) { const A = SEAT_AV[h[2]], B = SEAT_AV[h[3]]; return OM.hop(t, h[0], h[1], A, B, {height: hopH(A, B), curve: E.quintInOut}); }
// size of a light that leaves at t0 (shrinks to a dot) and lands at t1 (springs open to `big`)
function travelSize(t, t0, t1, from, big, dot = 16) {
  if (t < t1) { const k = E.cubicOut(seg(t, t0, t0 + 0.12)); return {s: lerp(from, dot, k), fill: k}; }
  const k = spring(t - t1, 0.5, 17); return {s: lerp(dot, big, k), fill: clamp(1 - k, 0, 1)};
}
// → {x, y, w, h, r, fill, ring, glow, op}

    rowEls.forEach((el, i) => { const r = rowPos(t, i); put(el, r.x, r.y, 1, r.op * studioOut * back); }); }
  // ── right column: consensus, divergence, spectrum ──
  { const pi = OM.popIn(t, PANELS_IN + 0.12, {rise: 24}); const on = (t < PANELS_IN + 0.12 ? 0 : pi.op) * studioOut;
    put($('rcol'), 0, pi.dy, 1, on);
    ['ch', 'cm', 'dh'].forEach((k, j) => { const p2 = OM.popIn(t, PANELS_IN + 0.2 + j * 0.05, {rise: 14}); put(R[k], 0, p2.dy, 1, (t < PANELS_IN + 0.2 + j * 0.05 ? 0 : p2.op) * studioOut); });
    put(R.dm, 0, 0, 1, sstep(PANELS_IN + 0.3, PANELS_IN + 0.6, t) * fadeOut(t, MORPH0 - 0.1, 0.25) * studioOut);
    $('dcount').textContent = t < MORPH0 + 0.5 ? '0' : t < MORPH0 + 0.6 ? '1' : '2';
    DIV.forEach((dv, i) => {
      const w = OM.wordRise(t, MORPH0 + 0.35 + i * 0.12, {dist: 16}); put(R['dv' + i], 0, w.y, 1, (t < MORPH0 + 0.35 + i * 0.12 ? 0 : w.op) * studioOut);
      ['l0', 'l1', 'l2'].forEach((k, j) => put(R[k + i], 0, 0, 1, sstep(SPAV0 + 0.1 + j * 0.05, SPAV0 + 0.35 + j * 0.05, t) * studioOut));
      put(R['tick' + i], 0, 0, 1, sstep(MORPH0 + 0.75, MORPH0 + 1.0, t) * studioOut);
    });
    SP.forEach((s, j) => { const q = spavPos(t, j); put(s.el, q.x - 16 * q.s, q.y - 16 * q.s, q.s, q.op * studioOut); }); }
  // ── trails: where the light went, stretched into the two spectrum lines ──
  ['trA', 'trB'].forEach((id, i) => {
    const tr = TRS[i], pts = trailPts(t, tr), el = $(id);
    if (t < HOP[0][0] || pts.length < 2) { el.setAttribute('d', ''); return; }
    if (t < MORPH0) { const L = lightAt(t), h = tr.g.find(g => t >= HOP[g][0] && t < HOP[g][1]); if (h !== undefined) pts.push({x: L.x, y: L.y}); }
    el.setAttribute('d', 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('L'));
    const st = trailStyle(t, tr); el.setAttribute('stroke', st.stroke); el.setAttribute('stroke-width', st.w.toFixed(2));
    el.style.opacity = studioOut.toFixed(3);
  });
  // ── summary page ──
  { const out = fadeOut(t, END0 + 0.05, 0.45);
    const l = OM.wordRise(t, SUM_IN, {dist: 14}); put($('sumlab'), 240, 1400 + l.y, 1, (t < SUM_IN ? 0 : l.op) * out);
    put($('stats'), 240, 1526, 1, (t < SUM_IN + 0.08 ? 0 : 1) * out);
    statEls.forEach((s, i) => { const w = OM.wordRise(t, SUM_IN + 0.1 + i * 0.06, {dist: 16}); s.style.opacity = (t < SUM_IN + 0.1 + i * 0.06 ? 0 : w.op).toFixed(3); s.style.transform = `translateY(${w.y.toFixed(2)}px)`; });
    $('sumdiv').style.opacity = (sstep(SUM_IN + 0.2, SUM_IN + 0.5, t) * out).toFixed(3);
    // the drop cap is there before its paragraph: the light became it; the sentence follows
    const land = LIGHT_SUM[1] - 0.04; put($('para'), PARA.x, PARA.y, 1, (t < land ? 0 : 1) * out);
    const dc = $('dc'), warm = sstep(land, land + 0.08, t) * (1 - sstep(LIGHT_SUM[1] + 0.3, LIGHT_SUM[1] + 0.68, t));
    dc.style.color = `rgb(${Math.round(lerp(236, 245, warm))},${Math.round(lerp(238, 184, warm))},${Math.round(lerp(241, 65, warm))})`;
    dc.style.textShadow = warm > 0.01 ? `0 0 ${(26 * warm).toFixed(1)}px rgba(${AMB},${(0.55 * warm).toFixed(3)})` : 'none';
    [['pf', PARA_IN], ['pr', PARA_IN + 0.16]].forEach(([id, a]) => $(id).style.opacity = (t < a ? 0 : sstep(a, a + 0.32, t)).toFixed(3));
  }
  // ── end card: the light becomes the dot beside the name ──
  { put($('wm'), WM.left, WM.top, 1, t >= WM_IN ? 1 : 0);
    wmL.forEach((s, i) => { const d = OM.letterDrop(t, WM_IN, i, {dist: 54}); s.style.opacity = (t < WM_IN ? 0 : d.op).toFixed(3); s.style.transform = `translateY(${d.y.toFixed(2)}px) scale(${d.sx.toFixed(4)},${d.sy.toFixed(4)})`; });
    const w = OM.wordRise(t, SUB_IN, {dist: 12}); put($('wmsub'), WM.sub.x, WM.sub.y + w.y, 1, t < SUB_IN ? 0 : w.op * 0.9); }
  // ── the light ──
  { const L = lightAt(t); paintLight($('light'), L);
    const rest = L.ring * (L.w > 40 && L.w < 100 ? 1 : 0) * (t > LAND_HOST && t < SPEC0 + 0.3 ? 1 : 0);
    put($('pool'), L.x - 180, L.y - 180, 1, 0.9 * rest * L.op);
    LD.forEach(s => paintLight(s.el, splitAt(t, s))); }
  $('hud').textContent = 't=' + t.toFixed(3);
  return Promise.resolve();
}

// ════════════════════════════════════════ contract ════════════════════════════════════════
function effOp(el) { let o = 1; for (let n = el; n && n.nodeType === 1; n = n.parentElement) { const cs = getComputedStyle(n); if (cs.visibility === 'hidden' || cs.display === 'none') return 0; o *= parseFloat(cs.opacity); } return o; }
window.__track = () => { const out = {};
  document.querySelectorAll('[data-k]').forEach(el => { const op = effOp(el); if (op < 0.02) return; const r = el.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    out[el.dataset.k] = {x: r.left, y: r.top, w: r.width, h: r.height, op}; });
  return out; };
window.__motion = (t0, t1) => {
  const c0 = camAt(t0), c1 = camAt(t1), cm = camAt((t0 + t1) / 2); let d = OM.screenTravel(c0, c1, cm);
  const M0 = OM.view(c0), M1 = OM.view(c1), A = movers(t0), B = movers(t1);
  for (let i = 0; i < Math.min(A.length, B.length); i++) { const p = OM.project(M0, A[i][0], A[i][1]), q = OM.project(M1, B[i][0], B[i][1]); d = Math.max(d, Math.hypot(p[0] - q[0], p[1] - q[1])); }
  return d; };
window.__events = () => {   // for the score: every contact, panned by where it is on screen at that instant
  const ev = [], at = (t, kind, wx, wy, v = 1) => { const p = OM.project(OM.view(camAt(t)), wx, wy); ev.push({t: +t.toFixed(3), kind, pan: +clamp((p[0] - 960) / 960, -1, 1).toFixed(3), v}); };
  for (let i = 1; i <= TOPIC.length; i++) { const tt = TYPE0 + i / TYPE_CPS; if (TOPIC[i - 1] !== ' ') at(tt - 0.05, 'key', caretX(tt), CARET_Y, 0.6 + 0.4 * ((i * 7) % 5) / 4); }
  at(ENTER - 0.02, 'enter', caretX(ENTER), CARET_Y);
  at(3.28, 'lift', caretX(ENTER), CARET_Y); at(LAND_HOST, 'land', SEAT_AV['周'].x, SEAT_AV['周'].y, 1);
  LD.forEach(s => { const q = splitAt(0, s); at(q.t1, 'seat', SEAT_AV[s.k].x, SEAT_AV[s.k].y, 0.8); });
  at(PANELS_IN, 'panels', 960, 540, 0.7);
  HOP.forEach((h, i) => { at(h[0], 'hop', SEAT_AV[h[2]].x, 185, 0.6 + 0.1 * i); at(h[1], 'hopland', SEAT_AV[h[3]].x, 185, i === 4 ? 1 : 0.8); });
  U.forEach((u, i) => { const t0 = hopEnd(i) + 0.18; for (let n = 2; n < u.text.length; n += 4) at(t0 + n / u.cps, 'type', STAGE_CX, CAP_Y, 0.5); });
  U.slice(0, 4).forEach((u, i) => at(retire(i) + 0.05, 'drop', 700, 600, 0.6));
  at(LIGHT_SPEC[0], 'stretch', SEAT_AV['周'].x, 185, 1); at(LIGHT_SPEC[1], 'tick', LXC, LY[1], 0.8);
  SP.forEach((s, j) => at(SPAV0 + j * 0.05 + 0.2, 'avatar', s.x, LY[s.line], 0.7));
  at(LIGHT_SUM[0], 'travel', LXC, LY[1], 1); at(LIGHT_SUM[1], 'dropcap', DC.x + 40, DC.y + 40, 1);
  at(END0 + 0.1, 'rise', DC.x + 40, DC.y + 40, 0.8); at(LIGHT_END[1], 'mark', WM.dot.x, WM.dot.y, 1);
  wmL.forEach((s, i) => { if (WORDMARK[i] !== ' ') at(WM_IN + i * 0.055 + 0.08, 'letter', WM.left + i * 70, WM.top + 50, 0.5); });
  return {T: DUR, events: ev.sort((a, b) => a.t - b.t)};
};
window.__seek = async t => { await seek(t); return true; };
window.__ready = (window.LOOK ? LOOK.ready : document.fonts.ready).then(() => document.fonts.ready).then(() => { measure(); grain(); return seek(0); });
const q = new URLSearchParams(location.search);
if (q.has('t')) __ready.then(() => seek(parseFloat(q.get('t'))));
if (q.has('hud')) $('hud').style.display = 'block';
if (q.has('play')) __ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
