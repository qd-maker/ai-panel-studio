# 一条命令起前后端：docker compose up --build ，然后打开 http://localhost:8080
# 默认 LLM_MODE=mock（不联网、不花钱）。用真实模型：在项目根目录建 .env，写入
#   LLM_MODE=deepseek
#   DEEPSEEK_API_KEY=你的 Key
# Key 只传给后端容器，前端镜像里没有它。

services:
  backend:
    build: ./backend
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      TURN_DELAY_S: ${TURN_DELAY_S:-1.5}
      MAX_EXPERT_TURNS: ${MAX_EXPERT_TURNS:-12}
    volumes:
      - panel-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  panel-data:
