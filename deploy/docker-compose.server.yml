# 线上演示站（roundtable.heyqi.xyz）的部署配置。
# 前端 nginx 容器名 panel，接入 SpeakLoop 的 Cloudflare 隧道网络 speakloop_default，
# 隧道的 Public Hostname 指向 http://panel:80。后端只在本项目内网，不对外暴露。
# 密钥和密码在同目录的 .env（chmod 600，不进仓库），变量说明见 backend/.env.example。

services:
  api:
    build: ./src/backend
    container_name: panel-api
    env_file: .env
    environment:
      APS_DATABASE_URL: sqlite:////data/app.db
    volumes:
      - ./data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./src/frontend
    container_name: panel
    volumes:
      - ./nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [internal, tunnel]
    restart: unless-stopped

networks:
  internal: {}
  tunnel:
    name: speakloop_default
    external: true
